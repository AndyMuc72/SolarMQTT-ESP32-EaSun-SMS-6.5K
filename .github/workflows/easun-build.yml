name: EASUN ESP32 build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Wemos D1 mini ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e wemos_d1_mini32

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: easun-sms-esp32-firmware
          path: |
            .pio/build/wemos_d1_mini32/*.bin
            .firmware/*.bin*
          if-no-files-found: error
          retention-days: 30

      - name: Attach firmware to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SolarMQTT ESP32 EaSun SMS 6.5K ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: .firmware/*.bin*
