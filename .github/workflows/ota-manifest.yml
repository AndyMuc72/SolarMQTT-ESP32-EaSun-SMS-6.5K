name: Publish OTA release index

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published EASUN release tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: easun-ota-release-index
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'AndyMuc72/SolarMQTT-ESP32-EaSun-SMS-6.5K'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish validated board-specific release metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTA_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python tools/update_ota_manifest.py
